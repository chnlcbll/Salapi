<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salapi</title>
  <meta name="description" content="Peso-first currency converter with live exchange rates.">
  <meta name="theme-color" content="#0E4D3A">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://flagcdn.com data:; connect-src https://open.er-api.com https://cdn.jsdelivr.net https://latest.currency-api.pages.dev; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="brand" href="./">
        <img src="assets/logo.svg" alt="" width="36" height="36">
        <span>salapi</span>
      </a>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh rates" title="Refresh rates">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16m0 4v-4h-4"/></svg>
      </button>
    </header>

    <section class="card converter" aria-label="Converter">
      <label class="field-label" for="amount">Amount</label>
      <div class="amount-row">
        <span class="amount-symbol" id="amountSymbol" aria-hidden="true">₱</span>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" spellcheck="false" value="1,000">
      </div>

      <div class="pair">
        <div class="pair-col">
          <span class="field-label">From</span>
          <button class="currency-btn" id="fromBtn" type="button" aria-haspopup="dialog"></button>
        </div>
        <button class="swap" id="swapBtn" type="button" aria-label="Swap currencies" title="Swap">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
        </button>
        <div class="pair-col">
          <span class="field-label">To</span>
          <button class="currency-btn" id="toBtn" type="button" aria-haspopup="dialog"></button>
        </div>
      </div>

      <div class="result" aria-live="polite">
        <p class="result-from" id="resultFrom"></p>
        <p class="result-main"><span id="resultValue">Loading…</span> <span class="result-code" id="resultCode"></span></p>
        <p class="result-rates" id="resultRates"></p>
        <div class="result-actions">
          <button class="pill-btn" id="copyBtn" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></g></svg>
            <span id="copyLabel">Copy</span>
          </button>
          <button class="pill-btn" id="favBtn" type="button" aria-pressed="false">Add to compare</button>
        </div>
      </div>
    </section>

    <section class="quick" aria-label="Quick picks">
      <div class="chips" id="chips"></div>
    </section>

    <section class="card compare" aria-labelledby="compareTitle">
      <div class="compare-head">
        <h2 id="compareTitle">Compare</h2>
        <button class="link-btn" id="addFavBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          Add
        </button>
      </div>
      <ul class="fav-list" id="favList"></ul>
    </section>

    <p class="status" id="status" role="status"></p>
    <footer class="foot">
      Mid-market rates, for reference. Banks and remittance shops quote slightly different rates.
    </footer>
  </main>

  <dialog id="picker" closedby="any" aria-labelledby="pickerTitle">
    <div class="picker-inner">
      <div class="picker-head">
        <h2 id="pickerTitle">Choose currency</h2>
        <button class="icon-btn" id="pickerClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <input id="pickerSearch" type="search" placeholder="Search country or currency" autocomplete="off" spellcheck="false" aria-label="Search currencies">
      <ul id="pickerList" class="picker-list"></ul>
    </div>
  </dialog>
</body>
</html>
